name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building release for tag: $tag"

      - name: Setup MinGW-w64 (GCC)
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install mingw -y --no-progress
          }

      - name: Configure and Build (CMake Release)
        shell: pwsh
        run: |
          gcc --version
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Release Assets
        shell: pwsh
        run: |
          $zipName = "discord-cli-windows-x64-$($env:TAG_NAME).zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\discord-cli.exe" -Destination "dist\discord-cli.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "dist\README.md" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "dist\LICENSE" }
          if (Test-Path ".env.example") { Copy-Item ".env.example" -Destination "dist\.env.example" }

          Compress-Archive -Path "dist\*" -DestinationPath $zipName -Force
          Copy-Item "build\Release\discord-cli.exe" -Destination "discord-cli.exe"

          $exeHash = (Get-FileHash "discord-cli.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  discord-cli.exe"
            "$zipHash  $zipName"
          ) | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Discord CLI ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            discord-cli-windows-x64-${{ env.TAG_NAME }}.zip
            discord-cli.exe
            SHA256SUMS.txt

